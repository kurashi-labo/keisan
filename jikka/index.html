<script>
/* KL_UI: 全ページ共通。ui_js は計算結果を得たあと KL_UI.applyWhen(result) を呼ぶ */
(function () {
  "use strict";
  var DAY_MS = 24 * 60 * 60 * 1000;
  function each(sel, fn) { Array.prototype.forEach.call(document.querySelectorAll(sel), fn); }
  function field(obj, path) {
    var cur = obj;
    String(path).split(".").forEach(function (k) { cur = (cur === null || cur === undefined) ? undefined : cur[k]; });
    return cur;
  }
  function parse(v) { try { return JSON.parse(v); } catch (e) { return v; } }
  function match(actual, op, expected) {
    if (actual === undefined || actual === null || actual === "") { return false; }
    if (op === ">=" || op === "<=") {
      var a = Number(actual), b = Number(expected);
      if (!isFinite(a) || !isFinite(b)) { return false; }
      return op === ">=" ? a >= b : a <= b;
    }
    if (op === "==") { return String(actual) === String(expected); }
    if (op === "in") {
      return Array.isArray(expected) && expected.some(function (v) { return String(v) === String(actual); });
    }
    return false;
  }
  function refreshBlocks() {
    each("[data-kl-cta-block]", function (block) {
      block.hidden = !block.querySelector(".kl-cta:not([hidden])");
    });
  }
  function applyWhen(result) {
    each(".kl-cta[data-when-field]", function (el) {
      el.hidden = !(result && match(field(result, el.getAttribute("data-when-field")),
        el.getAttribute("data-when-op"), parse(el.getAttribute("data-when-value"))));
    });
    refreshBlocks();
  }
  function hideStalePrices() {
    /* 楽天の価格は取得から24時間を超えたら出さない(ビルドが止まった日の保険) */
    each("[data-kl-fetched]", function (el) {
      var t = Date.parse(el.getAttribute("data-kl-fetched"));
      if (!isFinite(t) || Date.now() - t > DAY_MS) { el.textContent = "更新待ち"; el.classList.add("kl-stale"); }
    });
  }
  window.KL_UI = { applyWhen: applyWhen, match: match, refresh: refreshBlocks };
  document.addEventListener("DOMContentLoaded", function () { hideStalePrices(); refreshBlocks(); });
})();
</script>
